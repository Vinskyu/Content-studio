name: Build Android APK (ARM64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build ContentStudio Embedded Linux APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Termux ARM64 Bootstrap
        run: bash android/scripts/download-bootstrap.sh aarch64

      - name: Download & Install Static ARM64 FFmpeg & FFprobe
        run: |
          mkdir -p /tmp/ffmpeg-arm64
          cd /tmp/ffmpeg-arm64
          curl -fSL "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz" -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz --strip-components=1

          TARGET_JNI_DIR="${{ github.workspace }}/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$TARGET_JNI_DIR"
          cp ffmpeg "$TARGET_JNI_DIR/libffmpeg.so"
          cp ffprobe "$TARGET_JNI_DIR/libffprobe.so"
          chmod +x "$TARGET_JNI_DIR/libffmpeg.so" "$TARGET_JNI_DIR/libffprobe.so"

          if [ ! -s "$TARGET_JNI_DIR/libffmpeg.so" ] || [ ! -s "$TARGET_JNI_DIR/libffprobe.so" ]; then
            echo "[ERR] libffmpeg.so atau libffprobe.so tidak ditemukan atau kosong!"
            exit 1
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContentStudio-arm64-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
