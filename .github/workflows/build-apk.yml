name: Build Android APK (ARM64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build ContentStudio Native APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download & Install Static ARM64 FFmpeg & FFprobe
        run: |
          mkdir -p /tmp/ffmpeg-arm64
          cd /tmp/ffmpeg-arm64
          echo "[*] Mengunduh binary statis ARM64 FFmpeg..."
          curl -sSL "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz" -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz --strip-components=1
          
          echo "[*] Memverifikasi static linking dengan readelf..."
          readelf -l ffmpeg | grep -i "program interpreter" && {
            echo "[!] Peringatan: ffmpeg bukan binary statis!";
          } || echo "[OK] ffmpeg terverifikasi statically linked."

          TARGET_JNI_DIR="${{ github.workspace }}/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$TARGET_JNI_DIR"
          
          cp ffmpeg "$TARGET_JNI_DIR/libffmpeg.so"
          cp ffprobe "$TARGET_JNI_DIR/libffprobe.so"
          chmod +x "$TARGET_JNI_DIR/libffmpeg.so" "$TARGET_JNI_DIR/libffprobe.so"
          
          echo "[OK] FFmpeg & FFprobe ARM64 berhasil dipasang di jniLibs:"
          ls -lh "$TARGET_JNI_DIR"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContentStudio-arm64-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
